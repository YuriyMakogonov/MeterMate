<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MeterMate">
  <title>MeterMate</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="home"><span class="ico">📷</span><span>Показания</span></button>
    <button data-tab="history"><span class="ico">📋</span><span>История</span></button>
    <button data-tab="stats"><span class="ico">📊</span><span>Статистика</span></button>
    <button data-tab="settings"><span class="ico">⚙️</span><span>Настройки</span></button>
  </nav>
  <div id="overlay" hidden></div>
  <div id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
